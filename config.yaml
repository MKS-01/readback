# local-tts — offline article reader (v0.8.0).
# Paste a URL → fetch + extract the article → (optional LLM summary) → CSM-1B TTS
# → audio you play in-browser or download. All on-device.

ollama:
  # Used only by "summary" mode (turns the article into a spoken explanation).
  model: "nemotron-3-nano:4b"
  host: "http://localhost:11434"

tts:
  # CSM-1B (Sesame) via csm-mlx (senstella). Two voices map to CSM speaker IDs;
  # synth conditions on the built-in Sesame prompt clip for the active voice so
  # the voice stays good and consistent.
  engine: "csm"
  csm:
    # conversational_a (speaker 0 ★) / conversational_b (speaker 1).
    speaker: "conversational_a"
    # bf16 (clean + fast). Offline, so you can also use "fp32" for max quality.
    precision: "bf16"
    # Lower = steadier; higher = more varied. (No realtime constraint offline.)
    temperature: 0.7

reader:
  # Generated WAVs are written here and served for playback + download.
  output_dir: "~/.local-tts/reader"
  default_mode: "full"               # "full" (verbatim) or "summary" (LLM)
  gap_sec: 0.18                      # silence between (trimmed) chunks
  summary_max_chars: 16000           # cap article text fed to the LLM in summary mode
