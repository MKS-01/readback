ollama:
  model: "gemma4:e4b"  # was gemma4:26b / qwen3:8b
  host: "http://localhost:11434"
  system_prompt: |
    You are a conversational voice assistant. Speak naturally and concisely.
    Use complete sentences. Avoid bullet points, markdown, code blocks, or special characters.
    Keep responses under 3-4 sentences unless explicitly asked for more depth.
    Never start a sentence with asterisks, hyphens, or other punctuation.

kokoro:
  voice: "af_bella"                  # af_heart, af_bella, af_sarah, am_michael, bf_emma, bm_george, ...
  lang_code: "a"                     # "a"=American Eng, "b"=British, "j"=Japanese, "z"=Mandarin
  speed: 1.0
  torch_device: "cpu"                # cpu is fastest for kokoro on Apple Silicon (mps iSTFT falls back to cpu anyway)

whisper:
  # Multilingual variants (no .en suffix) handle non-US English accents
  # significantly better. Sizes (int8): tiny ~75MB, base ~150MB, small ~480MB,
  # medium ~1.5GB, large-v3-turbo ~1.6GB, large-v3 ~3GB.
  #
  # 'large-v3-turbo' is a distilled large-v3: near-large-v3 accuracy at
  # roughly the size and speed of medium. Best speed/quality pick on
  # M-series CPUs with adequate RAM. Drop to 'small' or 'base' for lower
  # latency on tight machines.
  model: "large-v3-turbo"
  compute_type: "int8"               # int8 recommended for Apple Silicon CPU

audio:
  sample_rate: 16000                 # whisper expects 16kHz
  output_sample_rate: 24000          # CSM outputs at 24kHz
  input_device: null                 # null = system default
  output_device: null

vad:
  aggressiveness: 2                  # 0 (permissive) to 3 (aggressive)
  silence_threshold_ms: 700
  speech_trigger_ms: 300
  # Below only used when input.mode == "vad". Speaker bleeds into mic;
  # we gate by both duration and loudness so the AI doesn't interrupt itself.
  allow_interrupt: true
  interrupt_speech_ms: 900
  interrupt_rms_threshold: 0.05

input:
  mode: "ptt"                        # "ptt" (push-to-talk) or "vad" (continuous)
  # IMPORTANT: pynput captures keys globally on macOS, so the PTT key must
  # not conflict with normal typing. Don't use "space" — every space you type
  # anywhere on the system would fire PTT and submit a mic snippet.
  # Safe choices: "alt_r" (right Option), "cmd_r" (right Cmd), "f1".."f12".
  ptt_key: "alt_r"                   # right Option/Alt key
  min_recording_ms: 200              # ignore PTT taps shorter than this

ui:
  default_mode: "voice"              # "voice" | "text"
  toggle_key: "f4"
  history_turns: 10                  # max turns kept in Ollama context
