# readback — offline article reader (v4.1.0).
# Paste a URL → fetch + extract the article → (optional LLM summary) → CSM-1B TTS
# → audio you play in-browser, in the terminal CLI, or download. All on-device.

llm:
  # ONE model, three jobs: Summary mode (spoken explanation), title generation,
  # and image / book-scan OCR. Runs in-process — mlx-lm for text, mlx-vlm for
  # OCR — so no external daemon is needed.
  #
  # Qwen3.5 is a VLM (its config carries a vision_config, and mlx-vlm ships a
  # qwen3_5 handler), which is why the old separate `ocr:` block is gone: it was
  # a second ~5.6 GB download doing a job this model already does.
  # ⚠ Switching to a text-only model disables image / book reads. Switchable
  # per-read via the CLI /model command.
  model: "mlx-community/Qwen3.5-9B-4bit"

tts:
  # CSM-1B (Sesame) via csm-mlx (senstella). Two voices map to CSM speaker IDs;
  # synth conditions on the built-in Sesame prompt clip for the active voice so
  # the voice stays good and consistent.
  engine: "csm"
  csm:
    # Active voice. Built-ins: conversational_a / conversational_b. Clone voices
    # under `voices:` add their own timbre/tone — "codeword" (young female) is default.
    speaker: "codeword"
    # Precision — speed vs fidelity:
    #   bf16 — ~6% faster than fp32, native on Apple Silicon, no audible quality
    #          loss at normal listening. Current default.
    #   fp32 — max fidelity (RTF ~0.72); use if you hear artifacts on a clone voice.
    #   fp16 — slightly faster than bf16, narrower dynamic range — not recommended.
    precision: "bf16"
    # Lower = steadier/more composed; higher = livelier. 0.7 matches the codeword
    # voice tuning; short (<5 s) reference clips get unstable below ~0.55.
    temperature: 0.7
    # Clone-condition voices: each clip's timbre + tone is reproduced in the read.
    # `wav` is relative to this file; `ref_text` MUST be the clip's exact transcript.
    voices:
      - name: "codeword"
        label: "Codeword ★"
        # 12 s CSM-bootstrapped reference (self-generated from the original clone),
        # so no source-video audio is retained. Exact transcript → reliable conditioning.
        wav: "src/voice/voice_codeword.wav"
        speaker: 0
        ref_text: "Welcome back everyone. Today we are going to look at how large language models actually process text and why that matters for the tools you use every day. Let's start with a simple example before we get into the details."
    # Fine-tuned voice: point at a `csm-mlx finetune lora` run dir (adapters.safetensors
    # + adapter_config.json). Loaded over the base weights; generation then uses
    # empty context per the FINETUNING preset. See src/finetune/README.md.
    # lora_path: "src/finetune/runs/v1"

    # ── Synthesis speed vs quality guide ──
    #
    # Three knobs control the speed/quality tradeoff. Each chunk pays a fixed
    # CSM reference-prefill cost (~1–2 s), so fewer chunks = faster reads — and
    # chunk count tracks the cap band's MEAN, so a low band is expensive: a
    # [120, 200] band measured 2.5-3x the chunks (and prefills) of 400 for the
    # same text. Smaller chunks do give the per-chunk expressive-temperature
    # nudge (speak.py's _expressive_temperature) finer granularity, but the
    # time cost dominates for Full-mode reads.
    #
    #   Preset       precision   chunk cap (speak.py)     Notes
    #   ─────────    ─────────   ────────────────────     ─────
    #   Current      bf16        randomized [280, 400]    fast (near the fixed-400 chunk
    #                                                      count) + varied breath cadence
    #   Balanced     bf16        280                      more natural sentence breaks
    #   Max prosody  bf16        randomized [120, 200]    finest expression granularity,
    #                                                      2.5-3x the chunks — slow
    #   Max fidelity fp32        200                      only if bf16 sounds off on a
    #                                                      clone voice, ~2× vs Current
    #
    # The band is [_MIN_CHUNK_CHARS, _MAX_CHARS] in src/readback/pipeline/speak.py.

reader:
  # Generated WAVs are written here and served for playback + download. Kept
  # next to the library DB (readback-audio-db/) so audio + metadata live in one
  # visible, back-up-able folder — not a hidden ~/.readback dir that's easy to
  # wipe by accident.
  output_dir: "../readback-audio-db/audio"   # sibling of the repo (resolved from here)
  default_mode: "full"               # "full" (verbatim) or "summary" (LLM)
  gap_sec: 0.18                      # silence between (trimmed) chunks
  summary_max_chars: 60000           # cap article text fed to the LLM in one pass before
                                      # map-reducing (Qwen3.5-9B has a 262K-token context —
                                      # 60K chars/~15K tokens leaves it single-passing the
                                      # vast majority of articles instead of map-reducing)
