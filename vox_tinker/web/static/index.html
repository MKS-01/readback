<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>vox-tinker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- timer + name kept in DOM for JS; visually hidden -->
  <span id="timer" style="display:none" aria-hidden="true">00:00</span>
  <span id="assistant-name" style="display:none" aria-hidden="true">vox-tinker</span>

  <header class="hdr">
    <div class="hdr-meta">
      <div class="meta-item">
        <span class="meta-label">voice</span>
        <span class="meta-value" id="voice-name">…</span>
      </div>
      <span class="meta-div" aria-hidden="true"></span>
      <div class="meta-item">
        <span class="meta-label">model</span>
        <span class="meta-value" id="model-name">…</span>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="orb-wrap">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>
      <span class="hud-ring r1" aria-hidden="true"></span>
      <span class="hud-ring r2" aria-hidden="true"></span>
      <span class="hud-ring r3" aria-hidden="true"></span>
      <div id="orb" class="orb idle">
        <canvas id="brain-canvas" class="brain-canvas" aria-hidden="true"></canvas>
      </div>
    </div>

    <div id="mic-meter" class="mic-meter" aria-hidden="true">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span>
    </div>

    <div id="captions" class="captions">
      <div class="caption-frame">
        <span class="caption-label" id="input-label">Input</span>
        <div id="user-caption" class="caption user"></div>
      </div>
      <div class="caption-frame ai-frame">
        <span class="caption-label">Response</span>
        <div id="ai-caption" class="caption ai"></div>
        <button id="copy-btn" class="copy-btn" type="button" aria-label="Copy response" title="Copy response" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="copy-label">Copy</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Settings backdrop (click to close) -->
  <div id="settings-backdrop" class="settings-backdrop" hidden></div>

  <!-- Settings bottom sheet -->
  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="settings-grid">

      <div class="settings-row">
        <label for="mic-select">Microphone</label>
        <select id="mic-select"></select>
      </div>

      <div class="settings-row">
        <label for="stt-select">
          Speech Recognition
          <span id="stt-status" class="settings-hint" aria-live="polite"></span>
        </label>
        <select id="stt-select"></select>
      </div>

      <div class="settings-row">
        <label for="model-select">
          LLM Model
          <span id="model-status" class="settings-hint" aria-live="polite"></span>
        </label>
        <select id="model-select"></select>
      </div>

      <div class="settings-row">
        <label for="voice-select">
          Voice
          <span id="voice-status" class="settings-hint" aria-live="polite"></span>
        </label>
        <select id="voice-select"></select>
      </div>

      <!-- THEME PICKER — reserved for future use
      <div class="settings-row settings-span">
        <label>Theme</label>
        <div class="theme-grid" id="theme-swatches" role="radiogroup" aria-label="Theme">
          <button type="button" class="theme-card" data-theme="ghost" aria-label="Ghost theme">
            <span class="theme-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
            <span class="theme-name">Ghost</span>
          </button>
        </div>
      </div>
      -->

      <div class="settings-row settings-span">
        <label>Speech Speed</label>
        <div class="speed-picker" id="speed-picker" role="group" aria-label="Speech speed">
          <button class="speed-btn" data-speed="0.85" type="button">Slow</button>
          <button class="speed-btn" data-speed="1.0" type="button">Medium</button>
          <button class="speed-btn" data-speed="1.2" type="button">Fast</button>
        </div>
      </div>

      <div class="settings-row">
        <label for="orb-size">Orb size</label>
        <div class="range-row">
          <input id="orb-size" type="range" min="120" max="380" step="10" value="240" />
          <span id="orb-size-val" class="settings-val">240</span>
        </div>
      </div>

      <div class="settings-row settings-toggles">
        <label class="toggle-item">
          <input id="show-meter" type="checkbox" checked />
          <span>Mic meter</span>
        </label>
        <label class="toggle-item">
          <input id="show-captions" type="checkbox" checked />
          <span>Captions</span>
        </label>
      </div>

    </div>
  </div>

  <footer class="dock">
    <form id="text-input-form" class="text-input-popover" autocomplete="off" hidden>
      <input
        id="text-input"
        class="text-input"
        type="text"
        placeholder="Type a message…"
        aria-label="Type a message"
      />
      <button type="submit" class="text-send" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>

    <div class="dock-pill">
      <button id="mute-btn" class="dock-btn" type="button" aria-label="Mute microphone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span>Mute</span>
      </button>
      <span class="dock-sep"></span>
      <button id="skip-btn" class="dock-btn skip" type="button" aria-label="Skip current response" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        <span>Skip</span>
      </button>
      <span class="dock-sep"></span>
      <button id="type-btn" class="dock-btn type" type="button" aria-label="Type a message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Type</span>
      </button>
      <span class="dock-sep"></span>
      <button id="end-btn" class="dock-btn end" type="button" aria-label="Pause call">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1"/>
          <rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
        <span>Pause</span>
      </button>
      <span class="dock-sep"></span>
      <button id="settings-btn" class="dock-btn" type="button" aria-label="Open settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="dock-foot" id="dock-foot">
      <span id="status-text">CONNECTING</span>
    </div>
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
