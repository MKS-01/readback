[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-tts"
version = "0.2.0"
description = "Local voice conversation using Kokoro TTS + Ollama on Apple Silicon"
requires-python = ">=3.10"
authors = [{ name = "mks" }]
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "faster-whisper>=1.0.3",
    "ollama>=0.4.0",
    "numpy>=1.24.0,<3.0.0",
    "webrtcvad-wheels>=2.0.14",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.28.0",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile>=0.12.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
local-tts = "local_tts.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["local_tts"]
