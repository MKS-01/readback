[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readback"
version = "3.7.0"
description = "Local offline article & book reader: URL or image → text → audio, via CSM-1B TTS + MLX on Apple Silicon"
requires-python = ">=3.10,<3.13"
authors = [{ name = "mks" }]
license = { text = "MIT" }
readme = "README.md"

# v0.8.0 pivot: offline article reader. The real-time voice cascade (Parakeet
# STT, Smart-Turn, webrtcvad, torch/transformers) was removed — TTS and the
# summary LLM both run on MLX (Apple Silicon), fully in-process.
dependencies = [
    "csm-mlx @ git+https://github.com/senstella/csm-mlx",  # CSM-1B TTS (dedicated MLX impl, 24kHz)
    "mlx-lm>=0.22.0",               # LLM inference (summary mode) — in-process on MLX/Metal
    "mlx-vlm",                       # Vision LLM for image OCR — in-process on MLX/Metal
    "trafilatura>=1.8.0",            # article extraction (URL → clean text)
    "numpy>=1.24.0,<3.0.0",
    "soundfile>=0.12.1",             # write generated WAVs
    "huggingface-hub>=0.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Test deps only. The suite covers pure logic (chunking, silence-tidy, text
# scrub, SQLite library, think-stripper) — no MLX/CSM, so CI runs it on Linux
# against the requirements-pi.txt subset + pytest (see .github/workflows/ci.yml).
test = ["pytest>=8.0"]

[project.scripts]
readback = "readback.__main__:main"

# csm-mlx is a direct git reference (no PyPI release); allow it.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/readback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
