[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readback"
version = "0.9.0"
description = "Local offline article reader: URL → article → audio, via CSM-1B TTS + Ollama on Apple Silicon"
requires-python = ">=3.10,<3.13"
authors = [{ name = "mks" }]
license = { text = "MIT" }
readme = "README.md"

# v0.8.0 pivot: offline article reader. The real-time voice cascade (Parakeet
# STT, Smart-Turn, webrtcvad, torch/transformers) was removed — TTS is pure MLX
# (csm-mlx) and the LLM runs in Ollama, so none of that is needed anymore.
dependencies = [
    "csm-mlx @ git+https://github.com/senstella/csm-mlx",  # CSM-1B TTS (dedicated MLX impl, 24kHz)
    "ollama>=0.6.0",                 # LLM client (summary mode); >=0.6 for chat(think=...)
    "trafilatura>=1.8.0",            # article extraction (URL → clean text)
    "numpy>=1.24.0,<3.0.0",
    "soundfile>=0.12.1",             # write generated WAVs
    "huggingface-hub>=0.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=41.0",            # self-signed TLS for LAN access
]

[project.scripts]
readback = "readback.__main__:main"

# csm-mlx is a direct git reference (no PyPI release); allow it.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["readback"]
