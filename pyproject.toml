[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-tts"
version = "0.1.0"
description = "Local voice conversation using Kokoro TTS + Ollama on Apple Silicon"
requires-python = ">=3.10"
authors = [{ name = "mks" }]

dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "faster-whisper>=1.0.3",
    "ollama>=0.4.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0,<3.0.0",
    "webrtcvad-wheels>=2.0.14",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pynput>=1.7.6",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.28.0",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile>=0.12.1",
]

[project.scripts]
local-tts = "local_tts.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["local_tts"]
