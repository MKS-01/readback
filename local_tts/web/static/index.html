<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>local-tts</title>
  <link rel="stylesheet" href="/static/styles.css?v=11" />
</head>
<body>
  <header class="hdr">
    <div class="hdr-title">
      <span id="assistant-name">Second Brain</span>
      <span id="timer" class="timer">00:00</span>
    </div>
    <div class="hdr-sub">voice <span id="voice-name">…</span> · model <span id="model-name">…</span></div>
  </header>

  <main class="stage">
    <button id="settings-btn" class="settings-btn" type="button" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <div class="orb-wrap">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>
      <span class="hud-ring r1" aria-hidden="true"></span>
      <span class="hud-ring r2" aria-hidden="true"></span>
      <span class="hud-ring r3" aria-hidden="true"></span>
      <div id="orb" class="orb idle">
        <canvas id="brain-canvas" class="brain-canvas" aria-hidden="true"></canvas>
      </div>
    </div>

    <div id="mic-meter" class="mic-meter" aria-hidden="true">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span>
    </div>

    <div id="captions" class="captions">
      <div class="caption-frame">
        <span class="caption-label">Input</span>
        <div id="user-caption" class="caption user"></div>
      </div>
      <div class="caption-frame ai-frame">
        <span class="caption-label">Response</span>
        <div id="ai-caption" class="caption ai"></div>
        <button id="copy-btn" class="copy-btn" type="button" aria-label="Copy response" title="Copy response" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="copy-label">Copy</span>
        </button>
      </div>
    </div>
  </main>

  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-row">
      <label for="mic-select">Microphone</label>
      <select id="mic-select"></select>
    </div>

    <div class="settings-row">
      <label for="stt-select">
        Voice model
        <span id="stt-status" class="settings-hint" aria-live="polite"></span>
      </label>
      <select id="stt-select"></select>
    </div>

    <div class="settings-row">
      <label>Theme</label>
      <div class="theme-swatches" id="theme-swatches">
        <span class="theme-swatch" data-theme="jarvis" title="Jarvis (cyan)"></span>
        <span class="theme-swatch" data-theme="hacker" title="Hacker (green)"></span>
      </div>
    </div>

    <div class="settings-row">
      <label for="orb-size">Orb size</label>
      <div class="range-row">
        <input id="orb-size" type="range" min="120" max="380" step="10" value="240" />
        <span id="orb-size-val" class="settings-val">240</span>
      </div>
    </div>

    <div class="settings-row inline">
      <label for="show-meter">Mic meter</label>
      <input id="show-meter" type="checkbox" checked />
    </div>
    <div class="settings-row inline">
      <label for="show-captions">Captions</label>
      <input id="show-captions" type="checkbox" checked />
    </div>
  </div>

  <footer class="dock">
    <form id="text-input-form" class="text-input-popover" autocomplete="off" hidden>
      <input
        id="text-input"
        class="text-input"
        type="text"
        placeholder="Type a message…"
        aria-label="Type a message"
      />
      <button type="submit" class="text-send" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>

    <div class="dock-pill">
      <button id="mute-btn" class="dock-btn" type="button" aria-label="Mute microphone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span>Mute</span>
      </button>
      <span class="dock-sep"></span>
      <button id="skip-btn" class="dock-btn skip" type="button" aria-label="Skip current response" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        <span>Skip</span>
      </button>
      <span class="dock-sep"></span>
      <button id="type-btn" class="dock-btn type" type="button" aria-label="Type a message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Type</span>
      </button>
      <span class="dock-sep"></span>
      <button id="end-btn" class="dock-btn end" type="button" aria-label="Pause call">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1"/>
          <rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
        <span>Pause</span>
      </button>
    </div>
    <div class="dock-foot" id="dock-foot">
      <span id="status-text">CONNECTING</span>
    </div>
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/static/app.js?v=11"></script>
</body>
</html>
